<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fallback title only: shown before React/Helmet mounts, and on any page (e.g. 404)
         that does not render <SEO>. src/components/SEO.tsx sets document.title on every
         public content page, so this is not a duplicate DOM node. -->
    <title>CV Writing Services for GCC Professionals | BrandMyProfile</title>
    <meta name="theme-color" content="#0066cc" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- Fonts with Display Swap, loaded non-render-blocking (Unit 9: preload + swap-media
         trick) - the stylesheet itself no longer blocks first paint; falls back to a normal
         blocking <link> via <noscript> for the rare case JS never runs. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Global Twitter metadata not managed by SEO.tsx -->
    <meta name="twitter:site" content="@brandmyprofile" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>

  <body>

    <!-- Static fallback for crawlers/AI agents that don't execute JavaScript
         (e.g. GPTBot, ClaudeBot, PerplexityBot). React/Helmet replace this
